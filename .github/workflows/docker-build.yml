name: Docker Build
# 为 fork 仓库构建并推送 Docker 镜像到 GHCR。
#
# 触发条件：
#   - 推送到 main 分支           → 打 :edge 和 :sha-<短sha> 标签
#   - 推送 v*.*.* 格式的 tag     → 打 :latest、:vX.Y.Z、:vX.Y 标签
#   - 手动运行（Actions 页面）    → 同上，按当前引用的类型决定
#
# 镜像地址：ghcr.io/gfriendyelin/easywall
# 只需要 GITHUB_TOKEN（自动注入），无需配置任何 secrets。
# Docker Hub / Quay 镜像没有配置——需要的话在 metadata-action 的 images 里加，
# 并参照上游 publish-edge.yml 加登录步骤。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/gfriendyelin/easywall
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU（arm64 跨架构编译需要）
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # GITHUB_TOKEN 自动登录 GHCR；包所有者就是仓库所有者。
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 按引用类型生成标签：
      #   main 分支 → edge、sha-xxxx
      #   vX.Y.Z tag → latest、vX.Y.Z、vX.Y
      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      # VERSION/REVISION 对应 Dockerfile 里声明的 ARG：
      # 版本号会注入到 easywall-core / easywall-web 的 -ldflags，
      # REVISION 写入 OCI label，页脚和 /healthz 都会显示它。
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
            REVISION=${{ github.sha }}
          # GHA 缓存让重复构建只重编译变化的层
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && 'latest' || 'edge' }}
